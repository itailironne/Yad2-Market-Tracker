# Brand theme — Anthropic / Claude design system.
# Drives the Streamlit widget chrome that CSS can't reach (slider fills, focus
# rings, selection highlights, BaseWeb menu surfaces). Values mirror the token
# block at the top of yad2_dashboard.py — keep the two in sync.
#   primaryColor          = colors.primary        (coral, the brand voltage)
#   backgroundColor       = colors.canvas         (tinted cream, NOT pure white)
#   secondaryBackgroundColor = colors.surface-card
#   textColor             = colors.ink            (warm off-black)
[theme]
base = "light"
primaryColor = "#cc785c"
backgroundColor = "#faf9f5"
secondaryBackgroundColor = "#efe9de"
textColor = "#141413"
font = "sans serif"
